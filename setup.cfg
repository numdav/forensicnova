[metadata]
name = forensicnova-dashboard
version = 0.1.0
description = Horizon dashboard plugin for ForensicNova — DFIR memory acquisition
author = Davide N.
url = https://github.com/numdav/forensicnova
license = Apache-2.0
classifiers =
    Development Status :: 4 - Beta
    Environment :: OpenStack
    Framework :: Django
    Intended Audience :: Information Technology
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
python_requires = >=3.10
packages = find:
include_package_data = True
zip_safe = False
install_requires =
    Django>=4.2
    horizon>=23.0.0
    requests>=2.28.0
    python-keystoneclient>=5.0.0

# Monorepo safety: restrict discovery to forensicnova_dashboard only.
# Without this, packages=find: would also pick up app/ (the Flask backend
# package), which belongs to a different venv and must NOT be pulled
# into Horizon's Python environment.
[options.packages.find]
include =
    forensicnova_dashboard
    forensicnova_dashboard.*

# Files shipped with the package. Setuptools glob is NOT recursive (no **),
# so each templates subdirectory is listed explicitly.
[options.package_data]
forensicnova_dashboard =
    dashboards/dfir/templates/dfir/acquisitions/*.html
    dashboards/dfir/templates/dfir/new_acquisition/*.html
    enabled/*.py
